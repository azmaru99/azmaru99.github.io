<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Othello Works</title>
  <meta name="description" content="これまでに作ったオセロ関連のサイト・ツールのまとめ">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <div class="logo" aria-hidden="true"><span class="disc black"></span><span class="disc white"></span></div>
      <h1>Othello Works</h1>
      <p class="lead">これまでに作ったオセロ関連のサイト・ツールをまとめています。</p>
    </div>
  </header>

  <main class="wrap">
    <div class="controls">
      <div class="filters" id="filters" role="tablist" aria-label="カテゴリ"></div>
      <input id="search" type="search" placeholder="検索…" aria-label="作品を検索">
    </div>
    <p class="count" id="count"></p>
    <ul class="grid" id="grid"></ul>
    <p class="empty" id="empty" hidden>該当する作品がありません。</p>
  </main>

  <footer class="wrap footer">© <span id="year"></span> Othello Works</footer>

  <script src="projects.js"></script>
  <script src="main.js"></script>
</body>
</html>
